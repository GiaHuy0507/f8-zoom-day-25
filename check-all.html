<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Check All</title>

    <link rel="stylesheet" href="./css/check-all.css" />
  </head>

  <body>
    <div class="container">
      <!-- Checkbox chính -->
      <label class="check-all">
        <input type="checkbox" id="check-all" />
        <span>All Statuses</span>
      </label>

      <!-- Số lượng đã chọn -->
      <p class="selected-count">
        Selected:
        <span id="selected-count">0</span>
        / 10
      </p>

      <!-- Danh sách -->
      <div class="status-list">
        <label class="status status-1">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 1</span>
        </label>

        <label class="status status-2">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 2</span>
        </label>

        <label class="status status-3">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 3</span>
        </label>

        <label class="status status-4">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 4</span>
        </label>

        <label class="status status-5">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 5</span>
        </label>

        <label class="status status-6">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 6</span>
        </label>

        <label class="status status-7">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 7</span>
        </label>

        <label class="status status-8">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 8</span>
        </label>

        <label class="status status-9">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 9</span>
        </label>

        <label class="status status-10">
          <input type="checkbox" class="status-checkbox" name="status" />
          <span>Status 10</span>
        </label>
      </div>
    </div>

    <script src="./js/check-all.js"></script>
  </body>
</html>
